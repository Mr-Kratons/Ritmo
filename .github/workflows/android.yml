
name: Gerar APK do Ritmo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Localizar projeto Kotlin
        id: projeto
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f Ritmo/settings.gradle.kts ]; then
            echo "dir=Ritmo" >> "$GITHUB_OUTPUT"
          else
            echo "ERRO: settings.gradle.kts não encontrado."
            echo "Verifique se os arquivos do projeto foram enviados."
            exit 1
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.projeto.outputs.dir }}"
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "ERRO: gradlew não encontrado na pasta do projeto."
            echo "O projeto precisa incluir o Gradle Wrapper."
            exit 1
          fi

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Ritmo-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
